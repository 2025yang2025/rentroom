<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房東管理系統</title>
    <!-- 引入 Bootstrap 5 與 SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .container { max-width: 500px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .highlight-group { background-color: #f0f7ff; padding: 16px; border-radius: 14px; border: 1px solid #e0effe; }
        .form-label { font-weight: 600; color: #334155; margin-bottom: 6px; font-size: 0.95rem; }
        .form-control { border-radius: 10px; padding: 10px 14px; border: 1px solid #cbd5e1; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn-custom { border-radius: 12px; padding: 12px; font-weight: 600; font-size: 1rem; transition: all 0.2s; }
        
        /* 頁籤專用樣式 */
        .nav-pills .nav-link { border-radius: 10px; font-weight: 600; padding: 8px 16px; color: #64748b; }
        .nav-pills .nav-link.active.bg-success { background-color: #10b981 !important; color: white; }
        .nav-pills .nav-link.active.bg-warning { background-color: #f59e0b !important; color: #1e293b; }
        .bg-advance-mode { background-color: #fffbeb; border: 1px solid #fef3c7; }
        .config-panel { background-color: #f1f5f9; border-radius: 12px; display: none; }
    </style>
</head>
<body>

<div class="container py-4">

    <!-- 🔒 GitHub API 連線配置 (點擊齒輪或未設定時顯示) -->
    <div class="d-flex justify-content-end mb-2">
        <button class="btn btn-link btn-sm text-secondary text-decoration-none" onclick="toggleConfig()">⚙️ 連線設定</button>
    </div>
    <div id="configSection" class="card p-3 mb-3 config-panel">
        <h6 class="fw-bold text-secondary mb-2">🔒 GitHub 連線配置</h6>
        <div class="row g-2">
            <div class="col-6"><input type="text" id="gitUser" class="form-control form-control-sm" placeholder="GitHub 帳號"></div>
            <div class="col-6"><input type="text" id="gitRepo" class="form-control form-control-sm" placeholder="專案倉庫名"></div>
            <div class="col-12">
                <div class="input-group input-group-sm">
                    <input type="password" id="gitToken" class="form-control" placeholder="Personal Access Token (PAT)">
                    <button class="btn btn-dark" type="button" onclick="saveConfig()">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 主卡片區域 -->
    <div class="card p-4">
        
        <!-- 頂部功能分流頁籤 -->
        <ul class="nav nav-pills nav-fill gap-2 p-1 bg-light rounded-3 mb-4" id="modeTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active bg-success" id="normal-tab" data-bs-toggle="tab" type="button" onclick="switchMode('normal')">🟢 當期正常收租 / 修改</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="advance-tab" data-bs-toggle="tab" type="button" onclick="switchMode('advance')">⏩ 房客提前繳租</button>
            </li>
        </ul>

        <div id="dynamicTitle" class="alert alert-info text-center fw-bold d-none mb-3" style="font-size: 1rem; border-radius: 10px;"></div>

        <form id="tenantForm" onsubmit="return false;">
            
            <!-- 藍色核心群組 -->
            <div class="highlight-group mb-4" id="coreGroup">
                <div class="mb-3">
                    <label class="form-label">📍 地點（如：台南）</label>
                    <input type="text" class="form-control" id="location" required oninput="matchAndUpdateTenantData()">
                </div>

                <div class="mb-3">
                    <label class="form-label">🚪 房間號碼（如：101房）</label>
                    <input type="text" class="form-control" id="room" required oninput="matchAndUpdateTenantData()">
                </div>

                <div class="mb-0">
                    <label class="form-label">👤 房客姓名</label>
                    <input type="text" class="form-control" id="name" oninput="updateDynamicTitle()">
                </div>
            </div>

            <!-- 💰 租金費用欄位（正常模式顯示固定租金，提前繳租模式變成輸入實收金額） -->
            <div class="mb-3 p-3 rounded d-none bg-advance-mode" id="advanceRentArea">
                <label class="form-label text-danger fw-bold">💰 本次【提前繳租】實收租金金額</label>
                <input type="number" class="form-control border-warning" id="advanceRentInput" placeholder="請輸入房客本次繳納的租金">
            </div>

            <div class="mb-3" id="normalRentArea">
                <label class="form-label">💰 每月租金 (不改不填)</label>
                <input type="number" class="form-control" id="rent" oninput="updateDynamicTitle()">
            </div>

            <div class="mb-3">
                <label class="form-label">🔒 押金總額 (追加/修改在此填新總額)</label>
                <input type="number" class="form-control" id="deposit" oninput="updateDynamicTitle()">
            </div>

            <div class="mb-3">
                <label class="form-label" style="color: #ea580c;" id="elecLabel">⚡ 當期應繳電費 (新抄表金額)</label>
                <input type="number" class="form-control" id="electricity" placeholder="例如：1250">
            </div>

            <div class="mb-3">
                <label class="form-label">📅 每月繳租日 (不改不填)</label>
                <input type="number" class="form-control" id="pay_day" min="1" max="31" oninput="updateDynamicTitle()">
            </div>

            <div class="mb-3">
                <label class="form-label">📝 合約開始日 (不改不填)</label>
                <input type="date" class="form-control" id="contract_start">
            </div>

            <div class="mb-4">
                <label class="form-label">⏳ 合約結束日 (不改不填)</label>
                <input type="date" class="form-control" id="contract_end">
            </div>

            <!-- 🛠️ 按鈕觸發區 (自動切換) -->
            <div id="normalAction">
                <button type="button" class="btn btn-primary btn-custom w-100 shadow-sm mb-2 text-white" id="btnNormal" onclick="submitNormalReceipt()">
                    🚀 登記當期收租並同步至系統
                </button>
                <button type="button" class="btn btn-outline-secondary btn-custom w-100 border-0 btn-sm text-muted" id="btnUpdate" onclick="submitTenantData()">
                    ⚙️ 僅變更/儲存基本資料與合約
                </button>
            </div>

            <div id="advanceAction" class="d-none">
                <button type="button" class="btn btn-warning btn-custom w-100 shadow-sm text-dark" id="btnAdvance" onclick="submitAdvanceReceipt()">
                    ⏩ 登記提前繳租並同步至系統
                </button>
            </div>
            
        </form>
    </div>
</div>

<!-- 引入 Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let globalTenantsData = [];
    let currentMode = 'normal';

    function getQueryParam(paramName) {
        const url = window.location.href;
        const regex = new RegExp('[?&]' + paramName + '=([^&#]*)', 'i');
        const results = regex.exec(url);
        return results ? decodeURIComponent(results[1]) : null;
    }

    document.addEventListener("DOMContentLoaded", function() {
        if(localStorage.getItem("git_user")) document.getElementById("gitUser").value = localStorage.getItem("git_user");
        if(localStorage.getItem("git_repo")) document.getElementById("gitRepo").value = localStorage.getItem("git_repo");
        if(localStorage.getItem("git_token")) document.getElementById("gitToken").value = localStorage.getItem("git_token");

        if (getQueryParam('location')) document.getElementById("location").value = getQueryParam('location');
        if (getQueryParam('room')) document.getElementById("room").value = getQueryParam('room');
        
        // 處理 Telegram 按鈕傳進來的 tab 參數的分流
        const tabParam = getQueryParam('tab');
        if (tabParam === 'advance' || getQueryParam('action') === 'advance') {
            const advTab = document.getElementById('advance-tab');
            if (advTab) {
                advTab.classList.add('active', 'bg-warning');
                document.getElementById('normal-tab').classList.remove('active', 'bg-success');
                switchMode('advance');
            }
        }

        fetchLatestTenantsJSON();
    });

    function switchMode(mode) {
        currentMode = mode;
        const normalTab = document.getElementById("normal-tab");
        const advTab = document.getElementById("advance-tab");
        const coreGroup = document.getElementById("coreGroup");
        const elecLabel = document.getElementById("elecLabel");
        
        if (mode === 'advance') {
            normalTab.classList.remove('active', 'bg-success');
            advTab.classList.add('active', 'bg-warning');
            
            document.getElementById("advanceRentArea").document.getElementById ? "" : document.getElementById("advanceRentArea").classList.remove("d-none");
            document.getElementById("normalRentArea").classList.add("d-none");
            document.getElementById("advanceAction").classList.remove("d-none");
            document.getElementById("normalAction").classList.add("d-none");
            coreGroup.className = "highlight-group mb-4 bg-advance-mode";
            elecLabel.innerText = "⚡ 提前繳租 - 實收電費金額";
            
            const currentRent = document.getElementById("rent").value;
            if(currentRent) document.getElementById("advanceRentInput").value = currentRent;
        } else {
            advTab.classList.remove('active', 'bg-warning');
            normalTab.classList.add('active', 'bg-success');
            
            document.getElementById("advanceRentArea").classList.add("d-none");
            document.getElementById("normalRentArea").classList.remove("d-none");
            document.getElementById("advanceAction").classList.add("d-none");
            document.getElementById("normalAction").classList.remove("d-none");
            coreGroup.className = "highlight-group mb-4";
            elecLabel.innerText = "⚡ 當期應繳電費 (新抄表金額)";
        }
    }

    function fetchLatestTenantsJSON() {
        const user = localStorage.getItem("git_user");
        const repo = localStorage.getItem("git_repo");
        const token = localStorage.getItem("git_token");
        if(!user || !repo || !token) return;

        fetch(`https://api.github.com/repos/${user}/${repo}/contents/tenants.json`, {
            headers: {
                "Accept": "application/vnd.github.v3.raw",
                "Authorization": `Bearer ${token}`,
                "Cache-Control": "no-cache"
            }
        })
        .then(res => res.json())
        .then(data => {
            globalTenantsData = Array.isArray(data) ? data : (data.tenants || []);
            matchAndUpdateTenantData();
        })
        .catch(err => console.error("資料撈取失敗:", err.message));
    }

    function matchAndUpdateTenantData() {
        const inputLocation = document.getElementById("location").value.trim();
        const inputRoom = document.getElementById("room").value.trim();
        if (!inputLocation || !inputRoom || globalTenantsData.length === 0) return;

        const match = globalTenantsData.find(t => 
            String(t.location).includes(inputLocation) && String(t.room).replace('房','').trim() === inputRoom.replace('房','').trim()
        );

        if (match) {
            document.getElementById("name").value = match.name || "";
            document.getElementById("rent").value = match.rent || "";
            document.getElementById("deposit").value = match.deposit || "";
            document.getElementById("pay_day").value = match.pay_day || "";
            document.getElementById("electricity").value = match.electricity || "";
            if(currentMode === 'advance') document.getElementById("advanceRentInput").value = match.rent || "";
            if(match.contract_start) document.getElementById("contract_start").value = match.contract_start;
            if(match.contract_end) document.getElementById("contract_end").value = match.contract_end;
        }
        updateDynamicTitle();
    }

    function updateDynamicTitle() {
        const room = document.getElementById("room").value.trim();
        const name = document.getElementById("name").value.trim();
        const titleDiv = document.getElementById("dynamicTitle");
        if (room && name) {
            titleDiv.classList.remove("d-none");
            titleDiv.innerText = `🏠 已選取房客：${name} (${room})`;
        } else {
            titleDiv.classList.add("d-none");
        }
    }

    function toggleConfig() {
        const panel = document.getElementById("configSection");
        panel.style.display = (panel.style.display === "none" || panel.style.display === "") ? "block" : "none";
    }

    function saveConfig() {
        localStorage.setItem("git_user", document.getElementById("gitUser").value.trim());
        localStorage.setItem("git_repo", document.getElementById("gitRepo").value.trim());
        localStorage.setItem("git_token", document.getElementById("gitToken").value.trim());
        Swal.fire('設定成功', '連線金鑰已儲存。', 'success');
        toggleConfig();
        fetchLatestTenantsJSON();
    }

    function dispatchToGitHub(payloadData, buttonId, successMsg) {
        const user = localStorage.getItem("git_user");
        const repo = localStorage.getItem("git_repo");
        const token = localStorage.getItem("git_token");
        const buttonEl = document.getElementById(buttonId);

        if(!user || !repo || !token) {
            Swal.fire({ icon: 'error', title: '缺少連線配置', text: '請點擊右上角⚙️設定連線資訊！' });
            toggleConfig();
            return;
        }

        const originalText = buttonEl.innerHTML;
        buttonEl.disabled = true;
        buttonEl.innerHTML = `⏳ 正在同步...`;

        fetch(`https://api.github.com/repos/${user}/${repo}/dispatches`, {
            method: "POST",
            headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28"
            },
            body: JSON.stringify({
                event_type: "webhook_event",
                client_payload: payloadData
            })
        })
        .then(response => {
            if(!response.ok) throw new Error(`HTTP ${response.status}`);
            Swal.fire({ icon: 'success', title: '同步成功！', text: successMsg + '已發送，約一分鐘後於 Telegram 更新。' });
            document.getElementById("electricity").value = "";
        })
        .catch(err => Swal.fire({ icon: 'error', title: '連線失敗', text: err.message }))
        .finally(() => {
            buttonEl.disabled = false;
            buttonEl.innerHTML = originalText;
        });
    }

    function submitTenantData() {
        const loc = document.getElementById("location").value.trim();
        const rm = document.getElementById("room").value.trim();
        if (!loc || !rm) return;
        const data = {
            action_type: "add_tenant",
            location: loc,
            room: rm,
            name: document.getElementById("name").value.trim(),
            rent: document.getElementById("rent").value ? parseInt(document.getElementById("rent").value) : null,
            deposit: document.getElementById("deposit").value ? parseInt(document.getElementById("deposit").value) : null,
            electricity: parseInt(document.getElementById("electricity").value) || 0,
            pay_day: document.getElementById("pay_day").value ? parseInt(document.getElementById("pay_day").value) : null,
            contract_start: document.getElementById("contract_start").value,
            contract_end: document.getElementById("contract_end").value
        };
        dispatchToGitHub(data, "btnUpdate", `【基本資料修改】`);
    }

    function submitNormalReceipt() {
        const loc = document.getElementById("location").value.trim();
        const rm = document.getElementById("room").value.trim();
        if (!loc || !rm) return;
        const data = {
            action_type: "confirm_receipt",
            location: loc,
            room: rm,
            electricity: parseInt(document.getElementById("electricity").value) || 0
        };
        dispatchToGitHub(data, "btnNormal", `【當期正常收租確認】`);
    }

    function submitAdvanceReceipt() {
        const loc = document.getElementById("location").value.trim();
        const rm = document.getElementById("room").value.trim();
        const advRent = document.getElementById("advanceRentInput").value;
        if (!loc || !rm || !advRent) {
            Swal.fire('提示', '請務必輸入提前繳租的實收租金金額！', 'warning');
            return;
        }
        const data = {
            action_type: "advance_receipt",
            location: loc,
            room: rm,
            rent: parseInt(advRent), 
            electricity: parseInt(document.getElementById("electricity").value) || 0
        };
        dispatchToGitHub(data, "btnAdvance", `【房客提前繳租確認】`);
    }
</script>
</body>
</html>
