name: Daily Rent & Contract Reminder via Telegram

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 
  
  # 🌟 改為：當有人建立含有特定標籤的 Issue 時，立刻觸發後台
  issues:
    types: [opened]

jobs:
  check-and-notify:
    # 💡 只在標籤為 rent-action 的 Issue 建立時才執行，防止別人亂玩
    if: contains(github.event.issue.labels.*.name, 'rent-action')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 🌟 將 Issue 的標題（裡面包含網頁傳過來的 JSON 資料）傳給 Python
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if [ -n "$(git status --porcelain tenants.json)" ]; then
          git add tenants.json
          git commit -m "🤖 自動更新房客資料 (來自網頁 Issue 觸發)"
          git push
        fi

    # 🌟 自動把執行完的 Issue 關閉，保持後台乾淨
    - name: Close Issue
      uses: peter-evans/close-issue@v3
      with:
        issue-number: ${{ github.event.issue.number }}
        comment: "🤖 後台已處理完畢，自動關閉案子。"
