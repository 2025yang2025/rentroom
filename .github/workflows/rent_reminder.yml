name: Daily Rent & Contract Reminder via Telegram

on:
  workflow_dispatch:
  repository_dispatch:
    types: [confirm_receipt, add_tenant]  # 🌟 規定外部只能用這兩個專屬暗號敲門
  schedule:
    - cron: '0 1 * * *'  
  issues:
    types: [opened]

jobs:
  check-and-notify:
    # 🌟 取消舊的 issue 標籤限制，改成：只要是 n8n/網頁點擊、手動點擊、或是特定的 Issue，通通放行！
    if: |
      github.event_name == 'repository_dispatch' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'rent-action'))
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 🌟 如果是 Issue 觸發就帶入 Body，如果是 n8n 觸發則由 python 解析 client_payload（此處相容舊設定）
        ISSUE_BODY: ${{ github.event.issue.body }}
        # 🌟 把 n8n 傳過來的資料袋也同步塞給環境變數，方便 Python 讀取
        CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if [ -n "$(git status --porcelain tenants.json)" ]; then
          git add tenants.json
          git commit -m "🤖 自動更新房客資料 (來自自動化觸發)"
          git push
        fi

    - name: Close Issue
      # 🌟 只在真的是 Issue 觸發的時候才跑關閉步驟，防止 n8n 觸發時這裡噴錯
      if: github.event_name == 'issues'
      uses: peter-evans/close-issue@v3
      with:
        issue-number: ${{ github.event.issue.number }}
        comment: "🤖 後台已處理完畢，自動關閉案子。"
