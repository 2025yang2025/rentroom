name: Daily Rent & Contract Reminder via Telegram

on:
  workflow_dispatch:
  repository_dispatch:
    # 🌟 修正：加入 webhook_event 讓 GitHub 接收網頁發出的請求
    types: [confirm_receipt, add_tenant, webhook_event] 
  schedule:
    - cron: '0 1 * * *'  
  issues:
    types: [opened]

jobs:
  check-and-notify:
    if: |
      github.event_name == 'repository_dispatch' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'rent-action'))
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run script
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if [ -n "$(git status --porcelain tenants.json)" ]; then
          git add tenants.json
          git commit -m "🤖 自動更新房客資料 (來自自動化觸發)"
          git push
        fi

    - name: Close Issue
      if: github.event_name == 'issues'
      uses: peter-evans/close-issue@v3
      with:
        issue-number: ${{ github.event.issue.number }}
        comment: "🤖 後台已處理完畢，自動關閉案子。"
